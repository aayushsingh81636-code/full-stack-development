<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="FormsActionPage.html" target="_parent" method="get" autocomplete="on">
        <label for="username" >Username:</label>
        <input type="text" id="username" name="username"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="Birthday">Birthday:</label>
        <input type="date" id="Birthday" name="Birthday"><br><br>
        <label for="birthday">Birthday:</label>
        <input type="datetime-local" id="birthday" name="birthday"><br><br>
        <input type="image" src="submit.png" alt="Submit" width="40" height="40">
        <input type="image" src="reset.png" alt="Reset" width="40" height="40">
    </form>
</body>
</html>
